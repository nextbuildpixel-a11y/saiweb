# Database Configuration (Persistent Local Embedded H2 Database with MySQL Syntax Emulation)
spring.datasource.url=jdbc:h2:file:./data/ai_interview_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Database Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security Secret Configuration
app.jwt.secret=9a2f8c7e6b5d4a3f2e1d0c9b8a7f6e5d4c3b2a1f9e8d7c6b5a4f3e2d1c0b9a8f
app.jwt.expiration-ms=86400000

# File Storage Configuration
app.file.storage-path=./uploads

# AI LLM Engine Configuration
app.ai.provider=${AI_PROVIDER:mock}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-3.5-turbo}
app.ai.endpoint=${AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
app.ai.temperature=0.7
app.ai.max-tokens=1000
